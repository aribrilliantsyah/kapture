name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (contoh: v0.0.1)'
        required: true
        default: 'v0.0.1'

permissions:
  contents: write
  packages: write

jobs:
  release-packages:
    name: Build & Push GHCR Packages (Docker & Helm)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse version & commit
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          # SemVer murni tanpa awalan 'v' untuk Helm
          HELM_VER="${TAG#v}"
          # Pastikan nama owner selalu huruf kecil untuk GHCR
          OWNER_LC="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "OWNER_LC=${OWNER_LC}" >> $GITHUB_ENV
          echo "VERSION=${TAG}" >> $GITHUB_ENV
          echo "HELM_VERSION=${HELM_VER}" >> $GITHUB_ENV
          echo "COMMIT=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image (Multi-Arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ env.VERSION }}
            COMMIT=${{ env.COMMIT }}
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/kapture:${{ env.VERSION }}
            ghcr.io/${{ env.OWNER_LC }}/kapture:latest

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Package & Push Helm Chart to GHCR OCI
        run: |
          sed -i -E "s/^version: .*/version: ${{ env.HELM_VERSION }}/" charts/kapture/Chart.yaml
          sed -i -E "s/^appVersion: .*/appVersion: \"${{ env.VERSION }}\"/" charts/kapture/Chart.yaml
          
          mkdir -p dist/charts
          helm package charts/kapture -d dist/charts
          
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
          helm push "dist/charts/kapture-${{ env.HELM_VERSION }}.tgz" "oci://ghcr.io/${{ env.OWNER_LC }}/charts"

      - name: Upload Helm Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: helm-chart
          path: dist/charts/*.tgz

  release-binaries:
    name: Build Binaries & Create GitHub Release
    runs-on: ubuntu-latest
    needs: [release-packages]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse version & commit
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          HELM_VER="${TAG#v}"
          OWNER_LC="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "OWNER_LC=${OWNER_LC}" >> $GITHUB_ENV
          echo "VERSION=${TAG}" >> $GITHUB_ENV
          echo "HELM_VERSION=${HELM_VER}" >> $GITHUB_ENV
          echo "COMMIT=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Download Helm Artifact
        uses: actions/download-artifact@v4
        with:
          name: helm-chart
          path: dist/assets

      - name: Build Multi-Platform Binaries
        run: |
          mkdir -p dist/bin dist/assets
          MODULE="github.com/ordinary/k8s-log-catcher"
          LDFLAGS="-s -w -X ${MODULE}/internal/version.Version=${{ env.VERSION }} -X ${MODULE}/internal/version.Commit=${{ env.COMMIT }}"

          TARGETS=(
            "linux/amd64"
            "linux/arm64"
            "darwin/amd64"
            "darwin/arm64"
          )

          for TARGET in "${TARGETS[@]}"; do
            OS="${TARGET%/*}"
            ARCH="${TARGET#*/}"
            OUT_NAME="kapture"
            ARCHIVE_NAME="kapture_${{ env.VERSION }}_${OS}_${ARCH}.tar.gz"

            echo "Membangun binary untuk ${OS}/${ARCH}..."
            docker run --rm -v "$PWD":/app -w /app \
              -e CGO_ENABLED=0 -e GOOS=${OS} -e GOARCH=${ARCH} \
              golang:1.26-alpine go build \
              -ldflags="${LDFLAGS}" \
              -o "dist/bin/${OUT_NAME}" ./cmd/kapture

            tar -czvf "dist/assets/${ARCHIVE_NAME}" -C dist/bin "${OUT_NAME}"
            rm -f "dist/bin/${OUT_NAME}"
          done

          # Update deploy/install.yaml image tag & salin ke assets rilis
          sed -i -E "s|image: ghcr.io/[^/]+/kapture:[^ ]+|image: ghcr.io/${{ env.OWNER_LC }}/kapture:${{ env.VERSION }}|g" deploy/install.yaml
          cp deploy/install.yaml dist/assets/install.yaml

          # Buat berkas verifikasi SHA256
          cd dist/assets
          sha256sum * > checksums.txt
          cd ../..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: Kapture ${{ env.VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/assets/*
