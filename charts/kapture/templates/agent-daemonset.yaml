{{- if .Values.agent.enabled -}}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "kapture.fullname" . }}-agent
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kapture.labels" . | nindent 4 }}
    app: {{ include "kapture.name" . }}
    role: agent
spec:
  selector:
    matchLabels:
      app: {{ include "kapture.name" . }}
      role: agent
  template:
    metadata:
      labels:
        {{- include "kapture.selectorLabels" . | nindent 8 }}
        app: {{ include "kapture.name" . }}
        role: agent
    spec:
      serviceAccountName: {{ include "kapture.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.agent.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.agent.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.agent.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: agent
          image: {{ include "kapture.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--mode=agent"]
          env:
            - name: KAPTURE_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: KAPTURE_TIMEZONE
              value: {{ .Values.global.timezone | quote }}
            - name: KAPTURE_STORAGE_RETENTION
              value: {{ .Values.agent.storage.retention | quote }}
            - name: KAPTURE_STORAGE_MAX_DISK
              value: {{ .Values.agent.storage.maxDisk | quote }}
            - name: KAPTURE_AGENT_PORT
              value: {{ .Values.agent.port | quote }}
          resources:
            {{- toYaml .Values.agent.resources | nindent 12 }}
          ports:
            - containerPort: {{ .Values.agent.port }}
              name: http
          volumeMounts:
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: data
              mountPath: /data/kapture
            {{- if .Values.agent.dockerRuntimeCompat }}
            - name: dockercontainers
              mountPath: /var/lib/docker/containers
              readOnly: true
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.agent.port }}
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: {{ .Values.agent.port }}
            periodSeconds: 10
      volumes:
        - name: varlog
          hostPath:
            path: /var/log
            type: Directory
        - name: data
          hostPath:
            path: {{ .Values.agent.storage.hostPath }}
            type: DirectoryOrCreate
        {{- if .Values.agent.dockerRuntimeCompat }}
        - name: dockercontainers
          hostPath:
            path: /var/lib/docker/containers
            type: Directory
        {{- end }}
{{- end }}
