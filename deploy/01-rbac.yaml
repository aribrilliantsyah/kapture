apiVersion: v1
kind: ServiceAccount
metadata:
  name: kapture
  namespace: kapture
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kapture
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces"]
    verbs: ["get", "list", "watch"]
  # Agent mengikuti ownerReferences pod -> ReplicaSet -> Deployment dan
  # Job -> CronJob, supaya log semua generasi pod dikelompokkan per workload.
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kapture
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kapture
subjects:
  - kind: ServiceAccount
    name: kapture
    namespace: kapture
