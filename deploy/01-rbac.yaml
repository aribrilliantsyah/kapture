apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-log-catcher
  namespace: log-catcher
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-log-catcher
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-log-catcher
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k8s-log-catcher
subjects:
  - kind: ServiceAccount
    name: k8s-log-catcher
    namespace: log-catcher
