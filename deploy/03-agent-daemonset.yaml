apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kapture-agent
  namespace: kapture
  labels:
    app: kapture
    role: agent
spec:
  selector:
    matchLabels:
      app: kapture
      role: agent
  template:
    metadata:
      labels:
        app: kapture
        role: agent
    spec:
      serviceAccountName: kapture
      imagePullSecrets:
        - name: kapture-registry-secret
      tolerations:
        - operator: Exists          # Berjalan di semua node termasuk master
      containers:
        - name: agent
          image: registry.e-gitlab.prodak.id/bpd-diy1/va/kapture:v1.0.1
          args: ["--mode=agent"]
          env:
            - name: KAPTURE_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # Retensi data per node (default: 7 hari / 168 jam)
            - name: KAPTURE_STORAGE_RETENTION
              value: "168h"
            # Batas maksimal ukuran disk per node (default: 5GB)
            - name: KAPTURE_STORAGE_MAX_DISK
              value: "5GB"
            # Port internal agent (default: 19489)
            - name: KAPTURE_AGENT_PORT
              value: "19489"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          ports:
            - containerPort: 19489
              name: http
          volumeMounts:
            # Baca file log container di host node (read-only)
            - name: varlog
              mountPath: /var/log
              readOnly: true
            # Simpan database BadgerDB lokal di disk node
            - name: data
              mountPath: /data/kapture
          livenessProbe:
            httpGet:
              path: /healthz
              port: 19489
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: 19489
            periodSeconds: 10
      volumes:
        - name: varlog
          hostPath:
            path: /var/log
            type: Directory
        - name: data
          hostPath:
            path: /var/lib/kapture
            type: DirectoryOrCreate
