apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kapture-agent
  namespace: kapture
  labels:
    app: kapture
    role: agent
spec:
  selector:
    matchLabels:
      app: kapture
      role: agent
  template:
    metadata:
      labels:
        app: kapture
        role: agent
    spec:
      serviceAccountName: kapture
      imagePullSecrets:
        - name: gitlab-auth
      tolerations:
        - operator: Exists          # Berjalan di semua node termasuk master
      containers:
        - name: agent
          image: registry.e-gitlab.prodak.id/bpd-diy1/va/kapture:v1.0.4
          args: ["--mode=agent"]
          env:
            - name: KAPTURE_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # Zona waktu lokal: pembagian log per tanggal (penyimpanan, rekap,
            # hapus per tanggal) dan jam di dashboard. Samakan di agent & aggregator.
            - name: KAPTURE_TIMEZONE
              value: "Asia/Jakarta"
            # Retensi per node. "0" = log tidak pernah dihapus otomatis; hanya
            # max disk (hari terlama dibuang saat penuh) atau hapus manual.
            # Contoh lain: "30d", "168h".
            - name: KAPTURE_STORAGE_RETENTION
              value: "0"
            # Batas maksimal ukuran disk per node (default: 5GB)
            - name: KAPTURE_STORAGE_MAX_DISK
              value: "5GB"
            # Port internal agent (default: 19489)
            - name: KAPTURE_AGENT_PORT
              value: "19489"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          ports:
            - containerPort: 19489
              name: http
          volumeMounts:
            # Baca file log container di host node (read-only)
            - name: varlog
              mountPath: /var/log
              readOnly: true
            # Simpan database BadgerDB lokal di disk node
            - name: data
              mountPath: /data/kapture
            # Node dengan runtime Docker (cri-dockerd): symlink log menunjuk ke
            # /var/lib/docker/containers, aktifkan mount ini juga.
            # - name: dockercontainers
            #   mountPath: /var/lib/docker/containers
            #   readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: 19489
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: 19489
            periodSeconds: 10
      volumes:
        - name: varlog
          hostPath:
            path: /var/log
            type: Directory
        - name: data
          hostPath:
            path: /var/lib/kapture
            type: DirectoryOrCreate
        # - name: dockercontainers
        #   hostPath:
        #     path: /var/lib/docker/containers
        #     type: Directory
