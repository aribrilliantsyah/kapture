apiVersion: apps/v1
kind: Deployment
metadata:
  name: kapture-aggregator
  namespace: kapture
  labels:
    app: kapture
    role: aggregator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kapture
      role: aggregator
  template:
    metadata:
      labels:
        app: kapture
        role: aggregator
    spec:
      serviceAccountName: kapture
      imagePullSecrets:
        - name: gitlab-auth
      containers:
        - name: aggregator
          image: registry.e-gitlab.prodak.id/bpd-diy1/va/kapture:v1.0.4
          args: ["--mode=aggregator"]
          env:
            # Aggregator mendeteksi agent lewat K8s API
            - name: KAPTURE_DISCOVERY_METHOD
              value: kubernetes
            - name: KAPTURE_DISCOVERY_NAMESPACE
              value: kapture
            - name: KAPTURE_DISCOVERY_LABEL_SELECTOR
              value: "app=kapture,role=agent"
            - name: KAPTURE_DASHBOARD_PORT
              value: "19488"
            # Zona waktu lokal: pembagian log per tanggal (penyimpanan, rekap,
            # hapus per tanggal) dan jam di dashboard. Samakan di agent & aggregator.
            - name: KAPTURE_TIMEZONE
              value: "Asia/Jakarta"
            # Autentikasi dashboard & 2FA (diambil dari Secret)
            - name: KAPTURE_AUTH_ENABLED
              value: "true"
            - name: KAPTURE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: kapture-auth
                  key: username
            - name: KAPTURE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kapture-auth
                  key: password
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          ports:
            - containerPort: 19488
              name: dashboard
          volumeMounts:
            # Volume untuk menyimpan auth.json & konfigurasi 2FA
            - name: auth-data
              mountPath: /data/kapture
          # /healthz tidak butuh login; /api/v1/* butuh sesi (401 => pod di-restart terus)
          livenessProbe:
            httpGet:
              path: /healthz
              port: 19488
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: 19488
            periodSeconds: 10
      volumes:
        - name: auth-data
          hostPath:
            path: /var/lib/kapture-aggregator
            type: DirectoryOrCreate
