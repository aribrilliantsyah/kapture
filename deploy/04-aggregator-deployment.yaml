apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-log-catcher-aggregator
  namespace: log-catcher
  labels:
    app: k8s-log-catcher
    role: aggregator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8s-log-catcher
      role: aggregator
  template:
    metadata:
      labels:
        app: k8s-log-catcher
        role: aggregator
    spec:
      serviceAccountName: k8s-log-catcher
      containers:
        - name: aggregator
          image: registry.e-gitlab.prodak.id/bpd-diy1/va/kapture:v1.0.0
          args: ["--mode=aggregator"]
          env:
            # Aggregator mendeteksi agent lewat K8s API
            - name: LOG_CATCHER_DISCOVERY_METHOD
              value: kubernetes
            # Port dashboard
            - name: LOG_CATCHER_DASHBOARD_PORT
              value: "19488"
            # Autentikasi dashboard & 2FA (diambil dari Secret)
            - name: LOG_CATCHER_AUTH_ENABLED
              value: "true"
            - name: LOG_CATCHER_USERNAME
              valueFrom:
                secretKeyRef:
                  name: k8s-log-catcher-auth
                  key: username
            - name: LOG_CATCHER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: k8s-log-catcher-auth
                  key: password
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          ports:
            - containerPort: 19488
              name: dashboard
          volumeMounts:
            # Volume untuk menyimpan auth.json & konfigurasi 2FA
            - name: auth-data
              mountPath: /data/logcatcher
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 19488
            periodSeconds: 30
      volumes:
        - name: auth-data
          hostPath:
            path: /var/lib/k8s-log-catcher-aggregator
            type: DirectoryOrCreate
